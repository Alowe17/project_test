name: CI — Integration Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Show environment
        run: |
          echo "Java:" && java -version
          echo "Maven:" && mvn -version
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Event:  ${{ github.event_name }}"

      - name: Run integration tests (mvn verify)
        run: mvn -B clean verify

      - name: Upload Surefire test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14

      - name: Upload JAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 7

  delivery-gate:
    name: CD Gate (ready to deliver)
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Mark build as deliverable
        run: |
          echo "✅ Integration tests PASSED"
          echo "Artifact is ready for deployment to staging/production"
          echo "Commit: ${{ github.sha }}"
          echo "This is the Continuous Delivery gate — deploy would run here."
